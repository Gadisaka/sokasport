# Ubuntu + nginx reverse proxy for the Docker Compose backend (127.0.0.1:3001).
# Domain: kizza-api.sheqaygames.com
#
# Install on the VPS (install nginx if needed: sudo apt-get install -y nginx):
#   sudo cp deploy/nginx/kizza-api.conf /etc/nginx/sites-available/kizza-api.conf
#   sudo ln -sf /etc/nginx/sites-available/kizza-api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let’s Encrypt) — DNS A-record for kizza-api.sheqaygames.com must point to this server first:
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d kizza-api.sheqaygames.com
# Certbot edits this snippet in place under sites-available when you attach it; or rerun with the deployed path above.
#
# Point your SPA/admin env `VITE_*` / API base URL to https://kizza-api.sheqaygames.com
# once TLS is configured (HTTP until then).

server {
    listen 80;
    listen [::]:80;
    server_name kizza-api.sheqaygames.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
