# Admin panel static SPA — copy to sites-available and adjust server_name + root + SSL.
#
# Recommend: dedicate a subdomain (admin.sokasport.com), HTTPS only, tighten access.

server {
    listen 80;
    listen [::]:80;
    server_name admin.sokasport.com;

    root /var/www/sokasport-admin;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
