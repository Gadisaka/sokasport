# Frontend static SPA — copy to sites-available and adjust server_name + root + SSL paths.
#
# BEFORE TLS: nginx -t && reload. Then:
#   sudo certbot --nginx -d www.sokasport.com -d sokasport.com

server {
    listen 80;
    listen [::]:80;
    server_name www.sokasport.com sokasport.com;

    # After certbot: use root/server block from certbot, or uncomment SSL listen lines it adds.

    root /var/www/sokasport-frontend;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
